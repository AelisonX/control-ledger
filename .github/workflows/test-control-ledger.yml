name: Test control-ledger

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate valid example
        run: python control_ledger.py validate examples/ep-017.json

      - name: Analyse valid example
        run: python control_ledger.py analyse examples/ep-017.json

      - name: Reject overlapping segments
        run: |
          if python control_ledger.py validate examples/invalid-overlap.json; then
            echo "Expected overlap validation to fail, but it passed."
            exit 1
          else
            echo "Overlap correctly rejected."
          fi

      - name: Reject invalid source
        run: |
          if python control_ledger.py validate examples/invalid-source.json; then
            echo "Expected invalid source validation to fail, but it passed."
            exit 1
          else
            echo "Invalid source correctly rejected."
          fi